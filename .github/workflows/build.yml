name: build

on:
  push:
    branches: [testing]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - "Directory.Build.*"
      - ".github/**"
  pull_request:
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - "Directory.Build.*"
      - ".github/**"
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Prepare Nuclear Option
        id: nomod
        uses: ./.github/actions/prepare-nomod

      - name: Hash managed dlls
        run: |
          set -euo pipefail
          MANAGED="${{ steps.nomod.outputs.managed-dir }}"
          {
            sha256sum \
              "$MANAGED/Assembly-CSharp.dll" \
              "$MANAGED/Mirage.dll" \
              "$MANAGED/Rewired_Core.dll" \
              "$MANAGED/UnityEngine.UI.dll"
          } | tee input-hashes.txt

      - name: Build in container
        run: ./scripts/build.sh --managed-dir "${{ steps.nomod.outputs.managed-dir }}"

      - name: Hash outputs
        run: |
          set -euo pipefail
          {
            sha256sum build-output/com.qwerty1423.NOAutopilot.dll
          } | tee output-hashes.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: NOAutopilot-release
          path: |
            build-output/com.qwerty1423.NOAutopilot-*.7z
            input-hashes.txt
            output-hashes.txt
          if-no-files-found: error
