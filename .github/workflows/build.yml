name: build

on:
  push:
    branches: [testing]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - "Directory.Build.*"
      - "packages.lock.json"
      - "Dockerfile.build"
      - "scripts/**"
      - "Profiles/**"
      - "Audio/**"
      - "LICENSE"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/**"
  pull_request:
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - "Directory.Build.*"
      - "packages.lock.json"
      - "Dockerfile.build"
      - "scripts/**"
      - "Profiles/**"
      - "Audio/**"
      - "LICENSE"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare Nuclear Option
        id: nomod
        uses: ./.github/actions/prepare-nomod

      - name: Hash managed dlls
        run: |
          set -euo pipefail
          MANAGED="${{ steps.nomod.outputs.managed-dir }}"
          {
            sha256sum \
              "$MANAGED/Assembly-CSharp.dll" \
              "$MANAGED/Mirage.dll" \
              "$MANAGED/Rewired_Core.dll" \
              "$MANAGED/UnityEngine.UI.dll"
          } | tee input-hashes.txt

      - name: Build in container
        run: ./scripts/build.sh --managed-dir "${{ steps.nomod.outputs.managed-dir }}"

      - name: Hash outputs
        run: |
          set -euo pipefail
          {
            sha256sum build-output/com.qwerty1423.NOAutopilot.dll
          } | tee output-hashes.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: NOAutopilot-release
          path: |
            build-output/com.qwerty1423.NOAutopilot-*.7z
            input-hashes.txt
            output-hashes.txt
          if-no-files-found: error
          compression-level: 0
