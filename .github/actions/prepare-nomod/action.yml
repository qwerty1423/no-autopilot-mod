name: prepare-nomod
description: modified from Tyler Kuhn's action

outputs:
  managed-dir:
    description: Path to the Managed assemblies directory
    value: ${{ steps.resolve.outputs.managed-dir }}
  game-version:
    description: Nuclear Option version from globalgamemanagers
    value: ${{ steps.meta.outputs.game-version }}
  game-build:
    description: Nuclear Option build hash from build-hash.txt
    value: ${{ steps.meta.outputs.game-build }}

runs:
  using: composite
  steps:
    - name: Cache Managed assemblies
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/nomod-managed
        key: nomod-managed-2

    - name: Check managed dir
      id: managed
      shell: bash
      run: |
        if [[ -f "$HOME/nomod-managed/Assembly-CSharp.dll" && -f "$HOME/nomod-managed/.game-version" && -f "$HOME/nomod-managed/.game-build" ]]; then
          echo "ready=true" >> "$GITHUB_OUTPUT"
        else
          rm -rf "$HOME/nomod-managed"
          echo "ready=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Install SteamCMD
      if: steps.managed.outputs.ready != 'true'
      shell: bash
      run: |
        set -euo pipefail
        sudo add-apt-repository -y multiverse
        sudo dpkg --add-architecture i386
        sudo apt-get update
        echo steam steam/question select "I AGREE" | sudo debconf-set-selections
        echo steam steam/license note '' | sudo debconf-set-selections
        sudo apt-get install -y steamcmd
        steamcmd +login anonymous +quit

    - name: Download Nuclear Option server
      if: steps.managed.outputs.ready != 'true'
      shell: bash
      run: |
        set -euo pipefail

        install_dir="$RUNNER_TEMP/NuclearOptionServer"
        managed="$install_dir/NuclearOptionServer_Data/Managed"

        for attempt in 1 2 3; do
          echo "SteamCMD attempt $attempt"
          steamcmd \
            +force_install_dir "$install_dir" \
            +login anonymous \
            +app_info_update 1 \
            +app_update 3930080 validate \
            +quit || true

          if [[ -f "$managed/Assembly-CSharp.dll" ]]; then
            break
          fi

          rm -rf "$HOME/Steam/appcache" \
                 "$HOME/.steam/appcache" \
                 "$HOME/.local/share/Steam/appcache" \
                 "$install_dir/steamapps/appmanifest_3930080.acf"
        done

        if [[ ! -f "$managed/Assembly-CSharp.dll" ]]; then
          echo "::error::SteamCMD failed to install app 3930080 after 3 attempts"
          exit 1
        fi

        version="$(grep -aoE '[0-9]+\.[0-9]+\.[0-9]+' "$install_dir/NuclearOptionServer_Data/globalgamemanagers" 2>/dev/null |
          grep -vE '^20[0-9][0-9]\.' |
          head -n1 || true)"
        build_hash="$(tr -d '\r\n' < "$install_dir/build-hash.txt" 2>/dev/null || true)"

        rm -rf "$HOME/nomod-managed.tmp"
        cp -r "$managed" "$HOME/nomod-managed.tmp"
        printf '%s\n' "$version" > "$HOME/nomod-managed.tmp/.game-version"
        printf '%s\n' "$build_hash" > "$HOME/nomod-managed.tmp/.game-build"
        mv "$HOME/nomod-managed.tmp" "$HOME/nomod-managed"
        rm -rf "$install_dir"

    - name: Resolve managed-dir
      id: resolve
      shell: bash
      run: echo "managed-dir=$HOME/nomod-managed" >> "$GITHUB_OUTPUT"

    - name: Read game metadata
      id: meta
      shell: bash
      run: |
        set -euo pipefail
        version="unknown"
        build="unknown"
        if [[ -f "$HOME/nomod-managed/.game-version" ]]; then
          value="$(tr -d '\r\n' < "$HOME/nomod-managed/.game-version")"
          if [[ -n "$value" ]]; then
            version="$value"
          fi
        fi
        if [[ -f "$HOME/nomod-managed/.game-build" ]]; then
          value="$(tr -d '\r\n' < "$HOME/nomod-managed/.game-build")"
          if [[ -n "$value" ]]; then
            build="$value"
          fi
        fi
        echo "game-version=$version" >> "$GITHUB_OUTPUT"
        echo "game-build=$build" >> "$GITHUB_OUTPUT"
        echo "Nuclear Option version: $version (build $build)" >> "$GITHUB_STEP_SUMMARY"
