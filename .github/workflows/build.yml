name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare Nuclear Option
        id: nomod
        uses: ./.github/actions/prepare-nomod

      - name: Build in container
        run: ./scripts/build.sh --managed-dir "${{ steps.nomod.outputs.managed-dir }}"

      - name: Hash stuff
        run: |
          set -euo pipefail
          MANAGED="${{ steps.nomod.outputs.managed-dir }}"
          {
            sha256sum \
                "$MANAGED/Assembly-CSharp.dll" \
                "$MANAGED/Mirage.dll" \
                "$MANAGED/Rewired_Core.dll" \
                "$MANAGED/UnityEngine.UI.dll" \
                "build-output/com.qwerty1423.NOAutopilot.dll"
          } | tee hashes.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: NOAutopilot-continuous
          path: |
            build-output/com.qwerty1423.NOAutopilot-*.7z
            hashes.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish continuous release
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.repository == 'qwerty1423/no-autopilot-mod'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: continuous-a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: NOAutopilot-continuous
          path: dist

      - name: Check tag
        run: |
          set -euo pipefail
          STRIPPED="$(printf '%s' "$RELEASE_TAG" | sed -E 's/v|-pre|_IL2CPP//g')"
          if printf '%s' "$STRIPPED" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::RELEASE_TAG '$RELEASE_TAG' parses as a version ('$STRIPPED')."
            exit 1
          fi

      - name: Rename
        run: |
          set -euo pipefail
          cd dist/build-output
          for f in com.qwerty1423.NOAutopilot-*.7z; do
            [ -e "$f" ] || continue
            mv "$f" "com.qwerty1423.NOAutopilot-continuous.7z"
            break
          done
          ls -la

      - name: Push tag
        run: |
          set -euo pipefail
          git tag --force "$RELEASE_TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$RELEASE_TAG"

      - name: Update continuous release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Continuous Build
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/build-output/com.qwerty1423.NOAutopilot-continuous.7z
          body: |
            Triggered on ${{ github.event.repository.updated_at }} by commit ${{ github.sha }} (@${{ github.actor }})

            This is an automated build of the latest source. It may be unstable. Use with caution!

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
