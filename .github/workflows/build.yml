name: build

on:
  push:
    branches: [testing]
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - "Directory.Build.*"
      - ".github/**"
  pull_request:
    paths:
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.sln"
      - "Directory.Build.*"
      - ".github/**"
  workflow_dispatch:
  workflow_call:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Prepare Nuclear Option
        id: nomod
        uses: ./.github/actions/prepare-nomod

      - name: Build in container
        run: ./scripts/build.sh --managed-dir "${{ steps.nomod.outputs.managed-dir }}"

      - name: List output
        run: find build-output/ -type f | sort

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: NOAutopilot-release
          path: build-output/com.qwerty1423.NOAutopilot-*.7z
          if-no-files-found: error
